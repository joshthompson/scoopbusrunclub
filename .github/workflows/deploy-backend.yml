name: Deploy Backend to Convex

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  # ScoopJS, from GitHub Packages. The install covers the whole workspace,
  # so it fetches the games' ScoopJS even though the backend doesn't use it.
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: |
          if [ -z "${{ secrets.CONVEX_DEPLOY_KEY }}" ]; then
            echo "CONVEX_DEPLOY_KEY is empty"
          else
            echo "CONVEX_DEPLOY_KEY is set"
          fi

      # GitHub Packages wants a token even to install ScoopJS (see
      # deploy-web.yml).
      - name: Log in to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm nx run api:deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
